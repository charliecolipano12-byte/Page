<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Manage Ate My's Kakanin pre-orders.">
    <title>Order Admin | Ate My's Kakanin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header" role="banner">
        <nav class="navbar" role="navigation" aria-label="Admin navigation">
            <a href="index.html" class="brand" aria-label="Ate My's Kakanin Home">
                <span class="brand-text">Ate My's Kakanin</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="menu.html" class="nav-link">Menu</a></li>
                <li><button class="nav-link nav-login" type="button" data-admin-logout>Log out</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">Pre-order Admin</h1>
                <p class="page-subtitle">Review customer pickup requests and update their status.</p>
            </div>
        </section>

        <section class="admin-section">
            <div class="container">
                <div class="admin-header">
                    <h2>Incoming Orders</h2>
                    <div class="admin-filters">
                        <label for="status-filter">Filter by status</label>
                        <select id="status-filter">
                            <option value="all">All statuses</option>
                            <option value="pending">Pending</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="ready">Ready for pickup</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                        <button class="btn btn-primary" type="button" data-refresh-orders>Refresh</button>
                    </div>
                </div>
                <p id="admin-message" role="status" aria-live="polite"></p>
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th scope="col">Order</th>
                                <th scope="col">Customer</th>
                                <th scope="col">Phone</th>
                                <th scope="col">Items and quantities</th>
                                <th scope="col">Pickup date</th>
                                <th scope="col">Pickup time</th>
                                <th scope="col">Status</th>
                                <th scope="col">Update</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body">
                            <tr><td colspan="8">Loading orders…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p class="copyright">&copy; <span data-current-year>2026</span> Ate My's Kakanin.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
