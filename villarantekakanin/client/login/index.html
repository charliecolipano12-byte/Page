<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to Ate My's Kakanin.">
    <title>Login | Ate My's Kakanin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="site-header" role="banner">
        <nav class="navbar" role="navigation" aria-label="Main navigation">
            <a href="../index.html" class="brand" aria-label="Ate My's Kakanin Home">
                <span class="brand-text">Ate My's Kakanin</span>
            </a>
            <a href="../index.html" class="nav-link">Back to Home</a>
        </nav>
    </header>

    <main>
        <section class="auth-header" aria-labelledby="login-title">
            <h1 id="login-title">Welcome back</h1>
            <p>Sign in to Ate My's Kakanin.</p>
        </section>

        <section class="auth-form" aria-label="Login form">
            <div class="form-container">
                <form id="login-form" data-auth-form="login" novalidate>
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <div class="input-wrapper">
                            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="Enter your password">
                        </div>
                    </div>

                    <button class="btn btn-primary btn-full" type="submit">Login</button>
                    <p class="form-links" id="auth-message" role="status" aria-live="polite"></p>
                </form>
                <p class="form-links">New here? <a href="../signup/">Create an account</a></p>
                <p class="form-links"><a href="../index.html">Return to the home page</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span data-current-year>2026</span> Ate My's Kakanin. All rights reserved.</p>
    </footer>

    <script src="../script.js"></script>
    <script src="../auth.js"></script>
</body>
</html>
