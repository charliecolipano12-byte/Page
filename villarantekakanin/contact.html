<body>
    <header class="site-header" role="banner">

            <a href="index.html" class="brand" aria-label="Villarante's Kakanin Home">
                <span class="brand-icon" aria-hidden="true">🍚</span>
                <span class="brand-text">Villarante's Kakanin</span>

            <button class="hamburger" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">

                <span class="hamburger-line" aria-hidden="true"></span>

                    <p><strong>Address:</strong><br><span data-business-address></span></p>
                    <p><strong>Phone:</strong><br><a data-business-phone></a></p>
                    <p><strong>Email:</strong><br><a data-business-email></a></p>
                    <p><strong>Hours:</strong><br><span data-business-hours></span></p>
                    <a href="checkout.html" class="btn btn-primary">Go to Checkout</a>
                </div>
            </div>
        </section>

    <footer class="site-footer">
        <div class="container">
            <p class="footer-business-info" data-business-summary></p>
            <div class="footer-bottom">
                <p class="copyright">&copy; <span data-current-year></span> <span data-business-name></span>. All rights reserved.</p>

        </div>
