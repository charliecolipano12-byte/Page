<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villarante's Kakanin - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-header">
        <h1>Contact Us</h1>
        <p>Place your pre-order or send us a message</p>
    </section>

    <section class="contact-form">
        <h2>Pre-Order Form</h2>
        <form id="preorderForm">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10,12}" required>
                <small>Format: 1234567890 (10-12 digits)</small>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="item">Select Item:</label>
                <select id="item" name="item" required>
                    <option value="">-- Choose an item --</option>
                    <option value="bibingka">Bibingka</option>
                    <option value="puto">Puto</option>
                    <option value="suman">Suman</option>
                    <option value="kutsinta">Kutsinta</option>
                    <option value="palitaw">Palitaw</option>
                    <option value="biko">Biko</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1" required>
            </div>
            <div class="form-group">
                <label for="date">Pick-up Date:</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="message">Special Instructions (optional):</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <button type="submit" class="btn">Place Order</button>
        </form>
        <div id="formMessage" class="form-message"></div>
    </section>

    <footer>
        <p>&copy; 2026 Villarante's Kakanin. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
